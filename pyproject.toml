[project]
name = "screamingllamas"
dynamic = ["version"]
description = "Cross-platform SEO site crawler: crawl a site, store every URL and link in SQLite, export CSVs."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx~=0.28.1",
  "selectolax~=1.0.2",
]

[project.scripts]
screamingllamas = "screamingllamas.cli:main"

[project.optional-dependencies]
ui = [
  "pywebview~=6.2.1",
]

[dependency-groups]
dev = [
  "pytest~=9.1.1",
  "ruff~=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/screamingllamas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/screamingllamas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
